name: ponte_app
description: "Ponte — conversa traduzida, fotos e filmes com legendas."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Servidor da conversa: broker público gratuito broker.emqx.io
  # (protocolo MQTT — não precisa de conta, chave nem cadastro).
  mqtt_client: 10.5.1

  # Reprodução de filmes (link mp4/m3u8 ou arquivo local)
  video_player: ^2.9.2

  # Fotos: galeria e câmera
  image_picker: ^1.1.2

  # Seleção de arquivos (filmes locais e legendas .srt/.vtt)
  file_picker: ^8.1.2

  # Requisições HTTP (tradução, download de legendas)
  http: ^1.2.2

  # Perfil salvo no aparelho
  shared_preferences: ^2.3.2

  # Gerenciamento de estado simples
  provider: ^6.1.2

  # Formatação de datas/horas
  intl: ^0.19.0

  # Pastas do aplicativo (salvar fotos e filmes)
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
